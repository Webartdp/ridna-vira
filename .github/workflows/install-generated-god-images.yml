name: Install generated god portraits

on:
  push:
    branches:
      - feature/site-build
    paths:
      - '.github/workflows/install-generated-god-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/site-build
          fetch-depth: 0

      - name: Decode generated portraits
        shell: bash
        run: |
          set -euo pipefail

          for encoded in scripts/god-images/*.b64; do
            [ -f "$encoded" ] || continue
            slug="$(basename "$encoded" .b64)"
            mkdir -p "public/assets/gods/$slug"
            base64 -d "$encoded" > "public/assets/gods/$slug/portrait.webp"
          done

          bash scripts/install-generated-god-images.sh

          echo "=== GENERATED PORTRAITS ==="
          find public/assets/gods -maxdepth 2 -name 'portrait.webp' -print -exec file {} \;

      - name: Commit portraits and remove one-time installer
        shell: bash
        run: |
          set -euo pipefail

          rm -rf scripts/god-images
          rm -f scripts/install-generated-god-images.sh
          rm -f .github/workflows/install-generated-god-images.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/assets/gods resources/views/pages/gods.blade.php resources/views/pages/god.blade.php scripts .github/workflows

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Install generated portraits for core Slavic deities"
          git push origin HEAD:feature/site-build
