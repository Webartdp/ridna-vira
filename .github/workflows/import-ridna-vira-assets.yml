name: Import Ridna Vira Figma assets

on:
  push:
    branches:
      - feature/site-build
    paths:
      - .github/workflows/import-ridna-vira-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/site-build
          fetch-depth: 0

      - name: Download exact Figma assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public/assets/figma/faith

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.figma.com/api/mcp/asset/c5d71cb0-a0f0-4ca1-be83-d73fdfb26589.png' \
            --output public/assets/figma/faith/calendar.png

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.figma.com/api/mcp/asset/80a3e874-6ae7-40ca-968e-1832aab312f5.png' \
            --output public/assets/figma/faith/books.png

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.figma.com/api/mcp/asset/8ae2d284-016e-4610-86a3-f0140d6f359c.png' \
            --output public/assets/figma/faith/gods.png

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.figma.com/api/mcp/asset/634b569e-41f8-4d43-b9ba-be13bdaae35d.png' \
            --output public/assets/figma/faith/shrines.png

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.figma.com/api/mcp/asset/e264c75c-591f-40cc-8b0c-769ad23de16f.png' \
            --output public/assets/figma/faith/rituals.png

          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.figma.com/api/mcp/asset/b1eef42f-f64b-49a6-a850-5240acc1e99d.png' \
            --output public/assets/figma/faith/prayers.png

          for asset in public/assets/figma/faith/*.png; do
            test -s "$asset"
            file "$asset"
          done

      - name: Commit assets and remove importer
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add public/assets/figma/faith
          git rm .github/workflows/import-ridna-vira-assets.yml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m 'Import exact Ridna Vira Figma assets'
          git push origin HEAD:feature/site-build
